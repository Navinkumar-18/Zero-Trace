[package]
name = "zt_engine"
version = "0.1.0"
edition = "2021"
description = "Zero Trace 2.0 — Rust execution engine for NIST SP 800-88 secure data sanitization"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "zt_engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
signal-hook = "0.4.5"

[dev-dependencies]
tempfile = "3"

[features]
default = []
loopdev_tests = []
